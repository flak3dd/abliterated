<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abliterated — App docs</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #0a0a0a; color: #e4e4e7; line-height: 1.55;
    }
    header {
      position: sticky; top: 0; z-index: 1;
      display: flex; gap: 1rem; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.25rem; border-bottom: 1px solid #27272a; background: #09090b;
    }
    header a { color: #a1a1aa; text-decoration: none; font-size: 12px; }
    header a:hover { color: #fafafa; }
    main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; font-size: 13px; }
    #status { color: #71717a; font-size: 12px; padding: 2rem 0; }
    #content h1 { font-size: 1.35rem; margin: 0 0 1rem; color: #fafafa; }
    #content h2 { font-size: 1.1rem; margin: 2rem 0 0.75rem; padding-top: 0.5rem; border-top: 1px solid #27272a; color: #f4f4f5; }
    #content h3 { font-size: 0.95rem; margin: 1.25rem 0 0.5rem; color: #e4e4e7; }
    #content p, #content li { color: #d4d4d8; }
    #content a { color: #93c5fd; }
    #content code {
      font-family: inherit; font-size: 0.92em; background: #18181b; padding: 0.1em 0.35em;
      border-radius: 3px; border: 1px solid #27272a;
    }
    #content pre {
      background: #18181b; border: 1px solid #27272a; border-radius: 6px;
      padding: 0.85rem 1rem; overflow-x: auto; color: #e4e4e7;
    }
    #content pre code { background: none; border: 0; padding: 0; }
    #content table { border-collapse: collapse; width: 100%; margin: 0.75rem 0 1rem; font-size: 12px; }
    #content th, #content td { border: 1px solid #27272a; padding: 0.4rem 0.55rem; text-align: left; vertical-align: top; }
    #content th { background: #18181b; color: #a1a1aa; font-weight: 600; }
    #content blockquote { margin: 0.75rem 0; padding-left: 0.85rem; border-left: 3px solid #3f3f46; color: #a1a1aa; }
    #content hr { border: 0; border-top: 1px solid #27272a; margin: 1.5rem 0; }
    #content strong { color: #fafafa; }
    #content ul, #content ol { padding-left: 1.35rem; }
  </style>
</head>
<body>
  <header>
    <strong style="font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:#fafafa">Abliterated · App docs</strong>
    <span>
      <a href="./APP.md">Raw APP.md</a> · <a href="./PRODUCT.md">Product</a> · <a href="./pricing.md">Pricing</a>
      ·
      <a href="/">IDE</a>
    </span>
  </header>
  <main>
    <div id="status">Loading APP.md…</div>
    <article id="content" hidden></article>
  </main>
  <script>
    (function () {
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function inline(s) {
        s = esc(s);
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
        return s;
      }
      function render(md) {
        var lines = md.replace(/\r\n/g, "\n").split("\n");
        var html = [];
        var i = 0;
        while (i < lines.length) {
          var line = lines[i];
          if (/^```/.test(line)) {
            var lang = line.slice(3).trim();
            var buf = [];
            i++;
            while (i < lines.length && !/^```/.test(lines[i])) {
              buf.push(lines[i]);
              i++;
            }
            html.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
            i++;
            continue;
          }
          if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*-/.test(lines[i + 1])) {
            var rows = [];
            while (i < lines.length && /^\|/.test(lines[i])) {
              rows.push(lines[i]);
              i++;
            }
            if (rows.length >= 2) {
              function cells(r) {
                return r.replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
              }
              var head = cells(rows[0]);
              html.push("<table><thead><tr>" + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>");
              for (var r = 2; r < rows.length; r++) {
                html.push("<tr>" + cells(rows[r]).map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>");
              }
              html.push("</tbody></table>");
            }
            continue;
          }
          if (/^### /.test(line)) { html.push("<h3>" + inline(line.slice(4)) + "</h3>"); i++; continue; }
          if (/^## /.test(line)) { html.push("<h2>" + inline(line.slice(3)) + "</h2>"); i++; continue; }
          if (/^# /.test(line)) { html.push("<h1>" + inline(line.slice(2)) + "</h1>"); i++; continue; }
          if (/^---+$/.test(line.trim())) { html.push("<hr />"); i++; continue; }
          if (/^>\s?/.test(line)) {
            var q = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) {
              q.push(lines[i].replace(/^>\s?/, ""));
              i++;
            }
            html.push("<blockquote><p>" + inline(q.join(" ")) + "</p></blockquote>");
            continue;
          }
          if (/^[-*] /.test(line)) {
            html.push("<ul>");
            while (i < lines.length && /^[-*] /.test(lines[i])) {
              html.push("<li>" + inline(lines[i].slice(2)) + "</li>");
              i++;
            }
            html.push("</ul>");
            continue;
          }
          if (/^\d+\. /.test(line)) {
            html.push("<ol>");
            while (i < lines.length && /^\d+\. /.test(lines[i])) {
              html.push("<li>" + inline(lines[i].replace(/^\d+\. /, "")) + "</li>");
              i++;
            }
            html.push("</ol>");
            continue;
          }
          if (!line.trim()) { i++; continue; }
          var para = [];
          while (i < lines.length && lines[i].trim() && !/^#{1,3} /.test(lines[i]) && !/^```/.test(lines[i]) && !/^\|/.test(lines[i]) && !/^[-*] /.test(lines[i]) && !/^\d+\. /.test(lines[i]) && !/^---+$/.test(lines[i].trim()) && !/^>\s?/.test(lines[i])) {
            para.push(lines[i]);
            i++;
          }
          html.push("<p>" + inline(para.join(" ")) + "</p>");
        }
        return html.join("\n");
      }
      var status = document.getElementById("status");
      var content = document.getElementById("content");
      fetch("./APP.md", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (md) {
          content.innerHTML = render(md);
          content.hidden = false;
          status.hidden = true;
        })
        .catch(function (err) {
          status.textContent = "Failed to load APP.md: " + err;
        });
    })();
  </script>
</body>
</html>
